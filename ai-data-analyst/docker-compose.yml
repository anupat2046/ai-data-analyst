version: "3.9"

# ── Shared build context ──────────────────────────────────────────────────────
x-build: &common-build
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime

# ── Shared restart policy ─────────────────────────────────────────────────────
x-restart: &restart
  restart: unless-stopped

services:

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  api:
    <<: [*common-build, *restart]
    container_name: ai-analyst-api
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 1
      --log-level info
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Streamlit frontend ──────────────────────────────────────────────────────
  frontend:
    <<: [*common-build, *restart]
    container_name: ai-analyst-frontend
    command: >
      streamlit run streamlit_app/app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
      --server.fileWatcherType=none
      --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Override API base URL so Streamlit talks to the api service by name
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  uploads_data:
    driver: local
